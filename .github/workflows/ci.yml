name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.6', '22', '24']
        include:
          # The repo is developed on Windows and sqlite depends on the native
          # better-sqlite3 — both platforms need at least one leg.
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Run tests with coverage (Linux / Node 22 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `node --check` parses without executing and exits non-zero on a syntax
      # error. Piping a module to stdin (the previous approach) *ran* it and
      # swallowed the exit code, so this job could never fail.
      - name: Check every source file parses
        run: npm run lint

      - name: Check package.json files are valid JSON
        run: |
          for f in package.json packages/*/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✔ $f"
          done

  # ────────────────────────────────────────────────────────────────────────────
  check-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check all packages share the same version
        run: node scripts/check-versions.js

  # ────────────────────────────────────────────────────────────────────────────
  # Summary job — PRs require this to pass
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [test, lint, check-versions]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          failed=0
          if [[ "${{ needs.test.result }}"           != "success" ]]; then echo "Tests failed";          failed=1; fi
          if [[ "${{ needs.lint.result }}"           != "success" ]]; then echo "Lint failed";           failed=1; fi
          if [[ "${{ needs.check-versions.result }}" != "success" ]]; then echo "Version check failed";  failed=1; fi
          if [[ "$failed" == "1" ]]; then exit 1; fi
          echo "All CI jobs passed ✔"
