name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.6', '22', '24']
        include:
          # The repo is developed on Windows and sqlite depends on the native
          # better-sqlite3 — both platforms need at least one leg.
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Run tests with coverage (Linux / Node 22 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ESLint for correctness rules (unused/dead code, fall-through, duplicate
      # keys), then `node --check` per file as a parse backstop. `npm run lint`
      # runs both; it used to be the parse check alone.
      - name: Lint
        run: npm run lint

      - name: Check package.json files are valid JSON
        run: |
          for f in package.json packages/*/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✔ $f"
          done

  # ────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (JSDoc → .d.ts)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Emits declarations from JSDoc via tsc --allowJs --checkJs. With
      # noEmitOnError now true, a type error fails the job *and* stops the stale
      # declarations from being written. See tsconfig.base.json.
      # dist-types/ is gitignored and rebuilt here; each package's
      # prepublishOnly rebuilds it again before publish, so a published
      # package can never carry declarations older than its source.
      - name: Build declarations for all packages
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  check-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check all packages share the same version
        run: node scripts/check-versions.js

  # ────────────────────────────────────────────────────────────────────────────
  # Summary job — PRs require this to pass
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck, check-versions]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          failed=0
          if [[ "${{ needs.test.result }}"           != "success" ]]; then echo "Tests failed";          failed=1; fi
          if [[ "${{ needs.lint.result }}"           != "success" ]]; then echo "Lint failed";           failed=1; fi
          if [[ "${{ needs.typecheck.result }}"      != "success" ]]; then echo "Typecheck failed";       failed=1; fi
          if [[ "${{ needs.check-versions.result }}" != "success" ]]; then echo "Version check failed";  failed=1; fi
          if [[ "$failed" == "1" ]]; then exit 1; fi
          echo "All CI jobs passed ✔"
